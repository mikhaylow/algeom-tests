<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Определитель. Свойства определителя</title>
</head>
<body>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            padding: 25px;
            width: 35%;
            min-height: 600px;
            min-width: 350px;
            box-sizing: border-box;
            border: 1px solid black;
        }

        .title {
            font-size: 1.6rem;
        }

        .test-info {
            margin-top: 20px;
            font-size: 1.2rem;
        }

        .start-button {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid black;
            margin-top: 20px;
        }

        .start-button:hover {
            cursor: pointer;
        }
    </style>
    <div class="wrapper">
        <div class="title">Определитель. Свойства определителя</div>
        <div class="test-info">Тест включает в себя 10 вопросов.</div>
        <div class="start-button">НАЧАТЬ</div>
    </div>
</body>
</html>
